services:
  - type: web
    name: checkit-frontend
    env: static
    buildCommand: "npm install -g pnpm && pnpm install --no-strict-dep-builds && pnpm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE
        sync: false
